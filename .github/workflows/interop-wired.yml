name: Wired Interop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pull images
        run: |
          docker pull ghcr.io/hakkadaikon/wired-moqt-interop:latest
          jq -r '.implementations[].roles.client.docker.image // empty' implementations.json \
            | grep '^ghcr.io/' | sort -u \
            | while read -r image; do docker pull "$image" || echo "WARNING: failed to pull $image"; done

      - name: Generate TLS certificates
        run: ./generate-certs.sh ./certs

      - name: Run interop tests (WebTransport relay)
        continue-on-error: true  # exits 1 when any test fails; publish results regardless
        run: make interop-relay RELAY=wired

      - name: Build raw-QUIC relay adapter
        run: docker build -t wired-interop-relay-quic:latest -f adapters/wired/Dockerfile.relay.quic adapters/wired

      - name: Run interop tests (raw QUIC relay, moqt://)
        continue-on-error: true
        run: make interop-relay RELAY=wired-quic

      - name: Upload all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-results
          path: results/

      # Each make interop-relay run writes its own results/<timestamp>/ and
      # generate-report.sh shows only the newest one. Fold the two runs into
      # one directory (summary.json rows carry the relay name) so a single
      # report shows wired and wired-quic side by side.
      - name: Merge wired and wired-quic results
        run: |
          set -euo pipefail
          dirs=$(ls -1d results/*/ | sort | tail -n 2)
          first=$(echo "$dirs" | head -n 1); second=$(echo "$dirs" | tail -n 1)
          [ "$first" != "$second" ] || exit 0
          cp -n "$second"/*.log "$first" 2>/dev/null || true
          jq -s '.[0].runs += .[1].runs | .[0]' \
            "$first/summary.json" "$second/summary.json" > merged.json
          mv merged.json "$first/summary.json"
          rm -rf "$second"

      - name: Generate report
        run: ./generate-report.sh

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN" results
